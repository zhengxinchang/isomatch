[workspace]
members = [".", "crates/libgtf"]
resolver = "3"

[package]
name = "isomatch"
version = "0.7.0"
edition = "2024"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
serde = {version = "1.0.215", features=["derive"]}
serde_json = "1.0"
log = "0.4.27"
env_logger = "0.11.6"
thiserror = "2.0.18"
anyhow = "1.0.102"
ahash = "0.8.12"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rustc-hash = "2.1.2"
flate2 = "1.1.5"
rust-lapper = "1.2.0"
num-format = "0.4.4"
libgtf = { path = "crates/libgtf" }
